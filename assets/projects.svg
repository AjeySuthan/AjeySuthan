<svg xmlns="http://www.w3.org/2000/svg" width="900" height="175" viewBox="0 0 900 175"><style>
@keyframes neon{0%{fill:#00f0ff}20%{fill:#ff2bd6}40%{fill:#39ff14}60%{fill:#ffe600}80%{fill:#ff1e2d}100%{fill:#00f0ff}}
@keyframes neonS{0%{stroke:#00f0ff}20%{stroke:#ff2bd6}40%{stroke:#39ff14}60%{stroke:#ffe600}80%{stroke:#ff1e2d}100%{stroke:#00f0ff}}
@keyframes blink{0%,42%,48%,60%,100%{opacity:1}44%,54%{opacity:.12}46%{opacity:.7}57%{opacity:.3}}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes jit{0%,92%,100%{transform:translate(0,0)}94%{transform:translate(3px,0)}96%{transform:translate(-3px,1px)}98%{transform:translate(2px,-1px)}}
.n{animation:neon 8s linear infinite}.ns{animation:neonS 8s linear infinite}
.bl{animation:blink 3.2s steps(1,end) infinite}.cu{animation:cur 1s steps(1,end) infinite}.jt{animation:jit 4s linear infinite}
text{font-family:"Courier New",Courier,monospace}.w{fill:#f2eaea}.m{fill:#b98}
</style>
